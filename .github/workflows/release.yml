name: Test and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - manifest.json
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: stream-saver-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for the test suite
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the release version
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          if os.environ['SOURCE_REF'].startswith('refs/tags/'):
            assert os.environ['SOURCE_NAME'] == 'v' + version, 'Tag must match manifest version'
          assert Path('RELEASE_NOTES.md').read_text().startswith('# Stream Saver v' + version + '\n'), 'Update the release notes before tagging'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('RELEASE_TAG=v' + version + '\n')
          PY

      - name: Run the automated tests
        run: node --experimental-vm-modules --test tests/recorder.test.mjs

      - name: Package the extension
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          files = [
            'manifest.json', 'background.js', 'common.js', 'db.js',
            'offscreen.html', 'offscreen.js', 'popup.html', 'popup.js',
            'recordings.html', 'recordings.js', 'style.css',
            'README.md', 'TESTING.md', 'LICENSE', 'tests/recorder.test.mjs',
            'icons/16.png', 'icons/32.png', 'icons/48.png', 'icons/128.png'
          ]
          Path('dist').mkdir(exist_ok=True)
          archive = Path('dist') / ('Stream-Saver-Chrome-Extension-v' + version + '.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
            for name in files:
              output.write(name, 'stream-saver/' + name)
          with zipfile.ZipFile(archive) as output:
            assert output.testzip() is None
          print(archive)
          PY

      - name: Publish the GitHub release and attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          if existing_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to a different commit; refusing to publish mismatched files."
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Stream-Saver-Chrome-Extension-${RELEASE_TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "Stream Saver ${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest
